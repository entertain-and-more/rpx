name: Source-Platform-Smoke P3

on:
  push:
    paths:
      - 'RPX_Pro_1.py'
      - 'translator.py'
      - 'rpx_pro/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'locales/**'
      - 'rulesets/**'
      - 'tests/source_platform_smoke.py'
      - 'tests/test_source_platform_smoke.py'
      - '.github/workflows/source-platform-smoke.yml'
  pull_request:
    paths:
      - 'RPX_Pro_1.py'
      - 'translator.py'
      - 'rpx_pro/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'locales/**'
      - 'rulesets/**'
      - 'tests/source_platform_smoke.py'
      - 'tests/test_source_platform_smoke.py'
      - '.github/workflows/source-platform-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Systemabhängigkeiten (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libpulse-mainloop-glib0 libasound2t64 || \
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libpulse-mainloop-glib0 libasound2

      - name: Python-Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Source-Platform-Smoke ausführen (Headless offscreen)
        run: |
          python tests/source_platform_smoke.py

      - name: Pytest Unit-Smoke ausführen
        run: |
          pytest tests/test_source_platform_smoke.py -v
