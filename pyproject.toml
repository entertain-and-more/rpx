[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rpx-pro"
version = "1.0.0"
description = "RolePlay Xtreme Professional Edition — Open source tabletop pen & paper RPG control center"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Lukas Geiger", email = "lukasgeiger@users.noreply.github.com"}
]
keywords = [
  "rpg",
  "tabletop",
  "pen-and-paper",
  "game-master",
  "pyside6",
  "python",
  "offline-first",
  "vtt",
  "json-rpc",
  "ttrpg",
  "campaign-manager",
  "pwa-companion"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Games/Entertainment :: Role-Playing"
]
dependencies = [
  "PySide6>=6.5.0",
  "pygame>=2.5.0"
]

[project.urls]
Homepage = "https://github.com/entertain-and-more/rpx"
Documentation = "https://github.com/entertain-and-more/rpx#readme"
Repository = "https://github.com/entertain-and-more/rpx.git"
Issues = "https://github.com/entertain-and-more/rpx/issues"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["tests"]
